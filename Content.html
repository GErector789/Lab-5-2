<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/style.css">
    <title>Contact page</title>
</head>
<body>
    <div class="main">
        <header class="header">
                <h2>Contact page</h2>
        </header>
         <div class="image">
            <div class="logo"> 
                <img src="Images/P-logo.png" alt="A phenoix with its wings spread" class="logo" height="75px">
            </div>
            <h2>Phoenix tech</h2>
        </div>
        <section class="direct">
            <div class="d-c">
                <nav>
                    <a href="index.html" class="but-1">Home</a>
                    <div class="line"></div>
                    <a href="Content.html" class="but-2 nav-active">Contact us</a>
                </nav>
            </div>
        </section>

        <form>
            <div class="form"> 
                <div class="inner-form">
                    <label for="name">Your name: </label>
                        <div class=box-b> 
                        <input type="text" id="name" name="name">
                        </div>
                </div>
                <div class="inner-form">
                    <label for="email">Your email: </label>
                        <div class=box-b> 
                        <input type="'email" id="email" name="email">
                        </div>
                </div>
                <div class="inner-form">
                    <label for="message">Your message: </label>
                        <div class=box-b> 
                        <textarea style="height: 50px;" id="message" name="message"></textarea>
                        </div>
                </div>
                <div class="submit">
                    <button type="submit"style="width: 150px;">Submit</button>
                </div>
            </div>
        </form>

        <footer>
            <p>Created by Ethan Rector <br> follow us on<a href="#">[Social media]</a></p>
        </footer>

    </div>
    
</body>
</html>
